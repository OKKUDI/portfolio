<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지민 — 작은 그림 작업실</title>

  <style>
    * {
      box-sizing: border-box;
    }

    /* 화면 전체를 사용하고 스크롤 없애기 */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: white;
    }

    body {
      color: #65535e;
      font-family: Georgia, "Apple SD Gothic Neo",
                   "Malgun Gothic", serif;
    }

    /* 그림을 화면 가운데 배치 */
    main {
      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      원본 그림 비율: 2420 × 1668
      가로와 세로가 모두 화면 안에 들어오도록 맞춰요.
    */
    .studio {
      position: relative;
      width: min(100vw, calc(100vh * 2420 / 1668));
      width: min(100vw, calc(100dvh * 2420 / 1668));
      aspect-ratio: 2420 / 1668;
      flex-shrink: 0;

      /* 글씨 크기도 그림 크기에 맞추기 */
      container-type: inline-size;
    }

    .studio-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 그림 속 TITLE 자리에 작가 이름 */
    .signature {
      position: absolute;
      left: 4%;
      top: 77%;
      width: 27%;
      height: 18%;
      padding-left: 6%;
      background: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .signature h1 {
      margin: 0;
      font-size: 5.5cqw;
      font-weight: normal;
      letter-spacing: 0.14em;
    }

    /* 말풍선의 영문 표기 */
    .contact-word {
      position: absolute;
      left: 74%;
      top: 18%;
      width: 13%;
      height: 4.5%;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.7cqw;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    /* 그림 위에 놓는 투명한 링크 */
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 15px;
    }

    .hotspot:hover {
      background: #dfb9c220;
    }

    .hotspot:focus-visible {
      outline: 2px solid #947d88;
      outline-offset: -2px;
    }

    .illustrations {
      left: 10%;
      top: 7%;
      width: 30%;
      height: 66%;
    }

    .about {
      left: 45%;
      top: 38%;
      width: 22%;
      height: 46%;
    }

    .contact {
      left: 71%;
      top: 13%;
      width: 22%;
      height: 36%;
    }

    .books {
      left: 73%;
      top: 64%;
      width: 18%;
      height: 26%;
    }
    .copyright {
      margin: 8px 0 0;
      font-family: sans-serif;
      font-size: clamp(8px, 0.9cqw, 12px);
      letter-spacing: 0.12em;
      color: #9a8992;
    }
  </style>
</head>

<body>
  <main aria-label="지민의 작은 그림 작업실">

    <div class="studio">
      <img
        class="studio-image"
        src="assets/studio-sketch.png"
        alt="액자, 그림 그리는 지민, 꽃을 물고 온 새와 책이 있는 작업실"
      >

      <div class="signature">
        <h1>지민</h1>
        <p class="copyright">© 2026 JIMIN</p>
      </div>

      <div class="contact-word" aria-hidden="true">
        CONTACT
      </div>

      <nav aria-label="그림 속 메뉴">
        <a
          class="hotspot illustrations"
          href="illustrations.html"
          aria-label="일러스트 작품 모음">
        </a>

        <a
          class="hotspot about"
          href="about.html"
          aria-label="작가 소개">
        </a>

        <a
          class="hotspot contact"
          href="contact.html"
          aria-label="연락처와 SNS">
        </a>

        <a
          class="hotspot books"
          href="books.html"
          aria-label="그림책 작업 모음">
        </a>
      </nav>
    </div>

  </main>
</body>
</html>
