<!DOCTYPE html>
<html lang="ko">
<head>
  <style>
    /* 기본 색과 글꼴 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: white;
      color: #65535e;
      font-family: Georgia, "Apple SD Gothic Neo",
                   "Malgun Gothic", serif;
    }

    .home {
      max-width: 1440px;
      margin: auto;
      padding: 12px 20px 20px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 12px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* 그림과 클릭 영역이 함께 줄어드는 상자 */
    .studio {
      position: relative;
      width: 100%;
    }

    .studio-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 스케치의 TITLE 자리에 표시할 이름 */
    .signature {
      position: absolute;
      left: 4%;
      top: 77%;
      width: 27%;
      height: 18%;
      padding-left: 6%;
      background: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .signature h1 {
      margin: 0;
      font-size: clamp(25px, 5.5vw, 76px);
      font-weight: normal;
      letter-spacing: 0.14em;
    }

    .signature p {
      margin: 10px 0 0;
      font-size: clamp(8px, 1vw, 12px);
      letter-spacing: 4px;
    }

    /* 스케치 말풍선의 영문 표기 */
    .contact-word {
      position: absolute;
      left: 74%;
      top: 18%;
      width: 13%;
      height: 4.5%;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(10px, 1.7vw, 24px);
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* 그림 위의 투명한 클릭 영역 */
    .hotspot {
      position: absolute;
      display: block;
      border: 1px solid transparent;
      border-radius: 20px;
      transition: background 0.2s, border-color 0.2s;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: #dfb9c220;
      border-color: #b28c9b;
      outline: none;
    }

    .illustrations {
      left: 10%;
      top: 7%;
      width: 30%;
      height: 66%;
    }

    .about {
      left: 45%;
      top: 38%;
      width: 22%;
      height: 46%;
    }

    .contact {
      left: 71%;
      top: 13%;
      width: 22%;
      height: 36%;
    }

    .books {
      left: 73%;
      top: 64%;
      width: 18%;
      height: 26%;
    }

    .hint {
      margin: 5px 0 25px;
      text-align: center;
      font-size: 12px;
      color: #8a7b83;
    }

    /* 휴대폰에서만 보여줄 큰 메뉴 */
    .mobile-nav {
      display: none;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: #8a7b83;
    }

    @media (max-width: 650px) {
      .home {
        padding: 8px 8px 20px;
      }

      .topline {
        font-size: 9px;
        letter-spacing: 1px;
      }

      .signature p {
        letter-spacing: 2px;
      }

      .hint {
        margin: 20px 0;
        font-size: 11px;
      }

      .mobile-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 30px 18px 20px;
      }

      .mobile-nav a {
        padding: 16px 10px;
        border: 1px solid #e7dbe0;
        border-radius: 8px;
        background: #fffdfa;
        color: inherit;
        text-align: center;
        text-decoration: none;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hotspot {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="home">

    <div class="topline">
      <span>JIMIN · ILLUSTRATOR</span>
      <span>작은 그림 작업실</span>
    </div>

    <div class="studio">

      <!-- 첫 화면 배경 그림 -->
      <img
        class="studio-image"
        src="assets/studio-sketch.png"
        alt="액자, 그림 그리는 지민, 꽃을 물고 온 새와 책이 있는 작업실"
      >

      <div class="signature">
        <h1>지민</h1>
        <p>PICTURES & STORIES</p>
      </div>

      <div class="contact-word" aria-hidden="true">
        CONTACT
      </div>

      <!-- 글씨 없이 그림을 누르면 별도 페이지로 이동 -->
      <nav aria-label="그림 속 메뉴">

        <a
          class="hotspot illustrations"
          href="illustrations.html"
          aria-label="일러스트 작품 모음">
        </a>

        <a
          class="hotspot about"
          href="about.html"
          aria-label="작가 소개">
        </a>

        <a
          class="hotspot contact"
          href="contact.html"
          aria-label="연락처와 SNS">
        </a>

        <a
          class="hotspot books"
          href="books.html"
          aria-label="그림책 작업 모음">
        </a>

      </nav>
    </div>

    <p class="hint">
      그림 속 액자, 사람, 새, 책을 눌러보세요.
    </p>

    <nav class="mobile-nav" aria-label="모바일 메뉴">
      <a href="illustrations.html">그림</a>
      <a href="about.html">작가 소개</a>
      <a href="contact.html">컨택 · SNS</a>
      <a href="books.html">그림책</a>
    </nav>

  </main>

  <footer>
    © JIMIN · ILLUSTRATION PORTFOLIO
  </footer>
</body>
</html>
