<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ILLUSTRATIONS — 지민</title>

  <style>
    /* 기본 디자인 */
    * {
      box-sizing: border-box;
    }

    html {
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background: #fffdfa;
      color: #65535e;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body.popup-open {
      overflow: hidden;
    }

    a {
      color: inherit;
    }

    /* 상단 이름과 그림 메뉴 */
    .site-header {
      max-width: 1300px;
      margin: auto;
      padding: 35px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .site-name {
      color: #795f6d;
      font-family: Georgia, serif;
      font-size: 42px;
      letter-spacing: 5px;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: clamp(20px, 5vw, 70px);
    }

    .header-menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 65px;
      height: 65px;
      color: #947d88;
      border-radius: 12px;
      transition: transform 0.2s, color 0.2s;
    }

    .header-menu a:hover {
      transform: translateY(-4px);
      color: #674955;
    }

    .header-menu a[aria-current="page"] {
      color: #674955;
    }

    .header-menu svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #947d88;
      outline-offset: 5px;
    }

    /* 페이지 제목 */
    main {
      max-width: 1300px;
      margin: auto;
      padding: 25px 30px 70px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: normal;
      letter-spacing: 2px;
    }

    .intro {
      margin-bottom: 40px;
      font-size: 14px;
      line-height: 1.8;
      color: #8a7882;
    }

    /* 높이가 서로 다른 4열 갤러리 */
    .gallery {
      column-count: 4;
      column-gap: 24px;
    }

    .gallery a {
      display: block;
      width: 100%;
      margin-bottom: 24px;
      break-inside: avoid;
      cursor: zoom-in;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 0.2s;
    }

    .gallery a:hover img {
      opacity: 0.85;
    }

    /* 작품 팝업 */
    .art-popup {
      width: min(960px, 92vw);
      max-height: 90vh;
      max-height: 90dvh;
      padding: 20px;
      border: none;
      border-radius: 12px;
      background: #fffdfa;
      color: #65535e;
      overflow-y: auto;
    }

    .art-popup::backdrop {
      background: rgba(35, 28, 32, 0.7);
    }

    .popup-close {
      display: block;
      margin: 0 0 16px auto;
      padding: 10px 16px;
      border: 1px solid #d9cbd2;
      border-radius: 30px;
      background: #fffdfa;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .popup-image {
      display: block;
      width: 100%;
      max-height: 65vh;
      max-height: 65dvh;
      object-fit: contain;
    }

    .popup-text {
      max-width: 700px;
      margin: 24px auto 12px;
      overflow-wrap: anywhere;
    }

    .popup-text h2 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: normal;
    }

    .popup-text p {
      margin: 0;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-line;
    }

    /* 중간 화면은 3열 */
    @media (max-width: 1000px) {
      .gallery {
        column-count: 3;
      }
    }

    /* 휴대폰은 2열 */
    @media (max-width: 600px) {
      .site-header {
        padding: 22px 16px;
        gap: 12px;
      }

      .site-name {
        font-size: 27px;
        letter-spacing: 2px;
      }

      .header-menu {
        gap: 8px;
      }

      .header-menu a {
        width: 44px;
        height: 44px;
      }

      main {
        padding: 25px 16px 50px;
      }

      .gallery {
        column-count: 2;
        column-gap: 14px;
      }

      .gallery a {
        margin-bottom: 14px;
      }

      .art-popup {
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .header-menu a,
      .gallery img {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="site-name" href="index.html">지민</a>

    <nav class="header-menu" aria-label="주요 메뉴">

      <!-- 액자 -->
      <a href="illustrations.html"
         aria-label="작품 모음"
         aria-current="page">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path d="M32 10 L65 12 L63 51 L31 49 Z"/>
          <path d="M12 43 L42 38 L47 68 L17 72 Z"/>
        </svg>
      </a>

      <!-- 책 -->
      <a href="books.html" aria-label="그림책">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path d="M20 14 Q39 18 60 10 L61 64 Q40 59 20 65 Z"/>
          <path d="M25 17 L25 60"/>
          <path d="M20 65 Q41 64 61 68"/>
        </svg>
      </a>

      <!-- 얼굴 -->
      <a href="about.html" aria-label="작가 소개">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path d="M16 46 C8 8 68 5 65 46"/>
          <path d="M21 37 C21 16 59 16 59 38 L58 49 C55 70 25 70 22 49 Z"/>
          <path d="M22 37 Q32 34 34 23"/>
          <path d="M34 24 Q36 36 43 36"/>
          <path d="M43 24 Q47 36 58 38"/>
          <path d="M20 43 C9 36 10 57 23 53"/>
          <path d="M60 43 C71 36 70 57 58 53"/>
          <circle cx="31" cy="44" r="1.5"/>
          <circle cx="49" cy="44" r="1.5"/>
          <path d="M36 53 Q40 57 44 53"/>
        </svg>
      </a>

      <!-- 새 -->
      <a href="contact.html" aria-label="연락처와 SNS">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path d="M18 42 C11 23 29 18 39 30 Q53 23 64 26 L74 13 L67 37 C61 64 31 68 18 42 Z"/>
          <path d="M17 36 L7 44 L20 42"/>
          <path d="M39 39 Q47 50 58 38"/>
          <circle cx="24" cy="33" r="1"/>
          <path d="M40 61 L37 68 M47 60 L45 67"/>
        </svg>
      </a>

    </nav>
  </header>

  <main>
    <h1>ILLUSTRATIONS</h1>
    <p class="intro">그림을 누르면 크게 보고, 작품 이야기를 읽을 수 있어요.</p>

    <div class="gallery">

      <!-- data-title은 제목, data-description은 설명이에요. -->
      <a href="assets/work-1.jpg"
         data-title="물가에 있는 두 인물"
         data-description="">
        <img src="assets/work-1.jpg"
             alt="물가에 있는 두 인물">
      </a>

      <a href="assets/work-2.jpg"
         data-title="커다란 꽃 아래의 두 아이"
         data-description="">
        <img src="assets/work-2.jpg"
             alt="커다란 꽃 아래의 두 아이">
      </a>

      <a href="assets/work-3.jpg"
         data-title="꽃을 안은 소녀"
         data-description="">
        <img src="assets/work-3.jpg"
             alt="꽃을 안은 소녀"
             loading="lazy">
      </a>

      <a href="assets/work-4.jpg"
         data-title="페이스트리 소녀"
         data-description="">
        <img src="assets/work-4.jpg"
             alt="페이스트리를 연상시키는 소녀"
             loading="lazy">
      </a>

      <a href="assets/work-5.jpg"
         data-title="분홍 안경"
         data-description="">
        <img src="assets/work-5.jpg"
             alt="분홍 안경을 쓴 인물"
             loading="lazy">
      </a>

      <!-- 새 그림은 이 위에 추가하면 돼요. -->
    </div>
  </main>

  <!-- 팝업 창 -->
  <dialog id="art-popup"
          class="art-popup"
          aria-labelledby="popup-title">

    <button type="button" class="popup-close" autofocus>
      닫기 ×
    </button>

    <img id="popup-image" class="popup-image" alt="">

    <div class="popup-text">
      <h2 id="popup-title"></h2>
      <p id="popup-description"></p>
    </div>
  </dialog>

  <script>
    const popup = document.querySelector("#art-popup");
    const popupImage = document.querySelector("#popup-image");
    const popupTitle = document.querySelector("#popup-title");
    const popupDescription =
      document.querySelector("#popup-description");

    // 그림을 누르면 팝업 열기
    document.querySelectorAll(".gallery a").forEach((link) => {
      link.addEventListener("click", (event) => {
        const image = link.querySelector("img");
        if (!image) return;

        // 단축키를 이용한 새 탭 열기는 유지
        if (
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey ||
          event.altKey
        ) return;

        event.preventDefault();

        popupImage.src = link.href;
        popupImage.alt = image.alt;
        popupTitle.textContent =
          link.dataset.title || image.alt || "작품";
        popupDescription.textContent =
          link.dataset.description || "";
        popupDescription.hidden =
          !popupDescription.textContent.trim();

        popup.showModal();
        popup.scrollTop = 0;
        document.body.classList.add("popup-open");
      });
    });

    // 닫기 버튼
    document.querySelector(".popup-close")
      .addEventListener("click", () => popup.close());

    // 닫히면 다시 페이지 스크롤 허용
    popup.addEventListener("close", () => {
      document.body.classList.remove("popup-open");
    });

    // 바깥의 어두운 영역을 눌러도 닫기
    popup.addEventListener("click", (event) => {
      if (event.target !== popup) return;

      const box = popup.getBoundingClientRect();

      if (
        event.clientX < box.left ||
        event.clientX > box.right ||
        event.clientY < box.top ||
        event.clientY > box.bottom
      ) {
        popup.close();
      }
    });
  </script>
</body>
</html>
