<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ILLUSTRATIONS — 지민</title>

  <style>
    /* 그림을 4개의 세로 칸에 자연스럽게 쌓기 */
.gallery {
  display: block;
  column-count: 4;
  column-gap: 28px;
}

.gallery a {
  display: block;
  break-inside: avoid;
  margin: 0 0 32px;
}

/* 가로 그림도 한 칸 안에 들어가도록 */
.gallery .wide {
  grid-column: auto;
}

/* 원래 그림 비율 유지 */
.gallery img {
  width: 100%;
  height: auto;
  display: block;
}

/* 크기와 여백에 작은 차이를 줘요 */
.gallery a:nth-child(3n + 2) {
  width: 88%;
  margin-left: auto;
}

.gallery a:nth-child(3n) {
  width: 94%;
}

/* 화면이 좁아지면 3열 → 2열 */
@media (max-width: 1000px) {
  .gallery {
    column-count: 3;
  }
}

@media (max-width: 600px) {
  .gallery {
    column-count: 2;
    column-gap: 16px;
  }

  .gallery a {
    margin-bottom: 20px;
  }
}
    /* 페이지 상단: 이름과 그림 메뉴 */
.site-header {
  max-width: 1300px;
  margin: 0 auto;
  padding: 35px 30px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
}

.site-name {
  color: #795f6d;
  font-family: Georgia, serif;
  font-size: 42px;
  letter-spacing: 5px;
  text-decoration: none;
  white-space: nowrap;
}

.header-menu {
  display: flex;
  align-items: center;
  gap: clamp(20px, 5vw, 70px);
}

.header-menu a {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 65px;
  height: 65px;
  color: #947d88;
  border-radius: 12px;
  transition: transform 0.2s, color 0.2s;
}

.header-menu a:hover {
  transform: translateY(-4px);
  color: #674955;
}

.header-menu a:focus-visible,
.site-name:focus-visible {
  outline: 2px solid #947d88;
  outline-offset: 5px;
}

.header-menu a[aria-current="page"] {
  color: #674955;
}

.header-menu svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 휴대폰에서는 간격과 아이콘 크기를 줄여요 */
@media (max-width: 600px) {
  .site-header {
    padding: 22px 16px;
    gap: 12px;
  }

  .site-name {
    font-size: 27px;
    letter-spacing: 2px;
  }

  .header-menu {
    gap: 8px;
  }

  .header-menu a {
    width: 44px;
    height: 44px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .header-menu a {
    transition: none;
  }
}
    /* 페이지의 기본 색과 글꼴 */
    body {
      margin: 0;
      background: #fffdfa;
      color: #65535e;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    /* 내용이 들어가는 공간 */
    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 24px;
    }

    a {
      color: inherit;
    }

    .back {
      display: inline-block;
      margin-bottom: 40px;
      text-decoration: none;
    }

    h1 {
      font-size: 36px;
      font-weight: normal;
      margin-bottom: 12px;
    }

    .intro {
      margin-bottom: 40px;
    }

    /* 그림을 두 줄의 세로 칸에 배치 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    .gallery a {
      display: block;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 가로로 긴 첫 두 그림은 넓게 보여줘요 */
    .wide {
      grid-column: 1 / -1;
    }

    /* 휴대폰에서는 한 칸씩 보여줘요 */
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

    <div class="gallery">
      <a class="wide" href="assets/work-1.jpg">

</html>
